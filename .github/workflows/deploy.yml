name: Deploy static site to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject GA & Clarity IDs
        run: |
          sed -i "s/GA_PLACEHOLDER/${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}/g" index.html
          sed -i "s/CLARITY_PLACEHOLDER/${{ secrets.PUBLIC_MS_CLARITY_ID }}/g" index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # root folder with index.html, styles.css, script.js, assets/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
